<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css" />
  <title>CSS Direction and Box Model - Ex 1</title>
</head>

<body>
  <div class="container">
    <header class="header">
      <h1>Travel Blog</h1>

        <img src="./image.jpeg" alt="คาเฟ่เชียงใหม่" class="card-image" />
        <p class="card-text">
        </p>
      </article>

      <article class="card">
        <h2 class="card-title">สถานที่น่าเที่ยว 10 อันดับ 2140</h2>
        <img src="./image.jpeg" alt="สถานที่น่าเที่ยว" class="card-image" />
        <p class="card-text">
        </p>
      </article>
    </main>
  </div>  
</body>

</html>
